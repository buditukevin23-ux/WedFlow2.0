<link rel="stylesheet" href="style.css">
 <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
 
</head>

<a href="dashboard.html">

<span>Accueil</span>
</a>

<a href="guests.html">
<i class="fi fi-rr-users"></i>
<span>Invités</span>

<a href="tables.html">

<body class="reception-page">


<script>

let loggedIn = localStorage.getItem("loggedIn");

if(loggedIn !== "true"){

window.location.href = "login.html";

}

</script>

<div class="reception-container">


<h1>
<i class="fi fi-rr-rings-wedding"></i>
WedFlow
</h1>

<h2>
<i class="fi fi-rr-door-open"></i>
Accueil des invités
</h2>

<p class="subtitle">
Trouvez rapidement la table d'un invité
</p>


<input 
type="text" 
id="searchName" 
placeholder="Entrez le nom de l'invité"
oninput="showSuggestions()">

<div id="suggestions"></div>


<button class="search-btn" onclick="searchReceptionGuest()">

<i class="fi fi-rr-search"></i>
Rechercher

</button>
<button class="qr-btn" onclick="startScanner()">
<i class="fi fi-rr-camera"></i>
Scanner une invitation
</button>

<div id="scanner"></div>

<div id="scanResult"></div>

<script src="https://unpkg.com/html5-qrcode"></script>


<div id="receptionResult"></div>


</div>


<script type="module" src="script.js"></script>


</body>
