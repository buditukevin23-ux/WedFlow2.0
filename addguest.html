<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ajouter un invité - WedFlow</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-rounded-regular/css/uicons-rounded-regular.css">

</head>


<body>


<h1>
<i class="fi fi-rr-add-user"></i> Ajouter un invité
</h1>


<input 
type="text" 
id="guestName"
placeholder="Nom de l'invité">

<input 
type="number"
id="guestNumber"
placeholder="Nombre de personnes"
min="1"
value="1">

<select id="guestTable">

<option value="">
Choisir une table
</option>

</select>



<button id="addGuestBtn">
Enregistrer l'invité
</button>



<div id="message"></div>



<script type="module" src="addguest.js"></script>


</body>

</html>
