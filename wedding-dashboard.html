<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mon mariage - WedFlow</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css">

</head>


<body>


<div class="wedding-dashboard">


<h1><i class="fi fi-rr-rings-wedding"></i> Mon mariage</h1>


<!-- Informations mariage -->

<div id="weddingInfo">

Chargement du mariage...

</div>



<!-- Statistiques -->

<div class="stats">


<div class="stat-card">
<h3><i class="fi fi-rr-users"></i> Invités</h3>
<p id="guestCount">0</p>
</div>


<div class="stat-card">
<h3><i class="fi fi-rr-check"></i> Arrivés</h3>
<p id="arrivedCount">0</p>
</div>


<div class="stat-card">
<h3><i class="fi fi-rr-table-picnic"></i> Tables</h3>
<p id="tableCount">0</p>
</div>


<div class="stat-card">
<h3><i class="fi fi-rr-ticket"></i> Code réception</h3>
<p id="receptionCode">---</p>
</div>


</div>




<!-- Barre de gestion -->


<div class="actions">


<button onclick="window.location.href='guests.html'">
<i class="fi fi-rr-users"></i> Invités
</button>


<button onclick="window.location.href='tables.html'">
<i class="fi fi-rr-table-picnic"></i> Tables
</button>


<button onclick="window.location.href='editwedding.html'">
<i class="fi fi-rr-edit"></i> Modifier mariage
</button>


<button onclick="window.location.href='access.html'">
<i class="fi fi-rr-lock"></i> Gestion des accès
</button>


</div>



</div>



<script type="module" src="wedding-dashboard.js"></script>


</body>

</html>
