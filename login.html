<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connexion - WedFlow</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-rounded-regular/css/uicons-rounded-regular.css">

</head>


<body class="login-page">


<div class="container">


<h1>

<i class="fi fi-rr-rings-wedding"></i>

WedFlow

</h1>



<h2>

<i class="fi fi-rr-sign-in-alt"></i>

Connexion

</h2>




<div class="input-box">


<i class="fi fi-rr-envelope"></i>


<input

type="email"

id="email"

placeholder="Adresse e-mail">


</div>





<div class="input-box">


<i class="fi fi-rr-lock"></i>


<input

type="password"

id="password"

placeholder="Mot de passe">


</div>





<button id="loginBtn">

<i class="fi fi-rr-sign-in-alt"></i>

Se connecter

</button>





<p>

Vous n'avez pas de compte ?

<a href="register.html">

Créer un compte

</a>

</p>




</div>




<script type="module" src="auth.js"></script>


</body>

</html>
