<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Créer un mariage - WedFlow</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<h1>Créer mon mariage</h1>

<form id="weddingForm">

    <input type="text" id="groomName" placeholder="Nom du marié" required>

    <input type="text" id="brideName" placeholder="Nom de la mariée" required>

    <input type="date" id="weddingDate" required>

    <input type="text" id="weddingPlace" placeholder="Lieu du mariage" required>

    <button type="submit">
        Enregistrer le mariage
    </button>

</form>

<script type="module" src="wedding.js"></script>

</body>




</html>
